<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="opticsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131d" />
      <stop offset="100%" stop-color="#090b12" />
    </linearGradient>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#opticsBg)" stroke="#222a3d" stroke-width="2" />

  <text x="400" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="800" text-anchor="middle">
    PINHOLE CAMERA PERSPECTIVE PROJECTION GEOMETRY
  </text>
  <text x="400" y="60" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">
    Mapping 3D World Space (X, Y, Z) to 2D Sensor Pixels (u, v) through the Optical Center
  </text>

  <!-- Optical Axis Line -->
  <line x1="80" y1="200" x2="720" y2="200" stroke="#333e54" stroke-width="2" stroke-dasharray="6 4" />
  <text x="730" y="204" fill="#606d85" font-family="'JetBrains Mono', monospace" font-size="10">Z Axis</text>

  <!-- Pinhole Aperture Barrier -->
  <line x1="400" y1="90" x2="400" y2="185" stroke="#485675" stroke-width="6" stroke-linecap="round" />
  <line x1="400" y1="215" x2="400" y2="310" stroke="#485675" stroke-width="6" stroke-linecap="round" />
  <circle cx="400" cy="200" r="5" fill="#ff8c33" />
  <text x="400" y="80" fill="#ff8c33" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Pinhole (Center of Projection)</text>

  <!-- Virtual Sensor Plane (Left) -->
  <line x1="260" y1="110" x2="260" y2="290" stroke="#007aff" stroke-width="4" />
  <rect x="250" y="110" width="20" height="180" fill="rgba(0, 122, 255, 0.1)" />
  <text x="260" y="98" fill="#007aff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sensor Plane</text>
  <text x="260" y="312" fill="#007aff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Distance = Focal Length (f)</text>

  <!-- Focal Length dimension -->
  <line x1="260" y1="230" x2="400" y2="230" stroke="#ff9500" stroke-width="1.5" />
  <text x="330" y="245" fill="#ff9500" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">f</text>

  <!-- 3D Object Point (Right) -->
  <circle cx="640" cy="120" r="7" fill="#34c759" />
  <text x="652" y="118" fill="#34c759" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">P(X, Y, Z)</text>
  <line x1="640" y1="120" x2="640" y2="200" stroke="#34c759" stroke-width="1" stroke-dasharray="3 3" />
  <text x="640" y="215" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Distance Z</text>

  <!-- Light Ray passing through Pinhole -->
  <line x1="640" y1="120" x2="400" y2="200" stroke="#ffd60a" stroke-width="2" />
  <line x1="400" y1="200" x2="260" y2="247" stroke="#ffd60a" stroke-width="2" />

  <!-- Inverted Projected Point on Sensor -->
  <circle cx="260" cy="247" r="6" fill="#ff3b30" />
  <text x="180" y="252" fill="#ff3b30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">p(u, v) [Inverted]</text>

  <!-- Projection Equation Box -->
  <rect x="80" y="120" width="130" height="60" rx="6" fill="#151b26" stroke="#252e3d" />
  <text x="145" y="142" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">u = f &times; (X / Z)</text>
  <text x="145" y="162" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">v = f &times; (Y / Z)</text>
</svg>
