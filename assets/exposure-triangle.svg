<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="triBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10141f" />
      <stop offset="100%" stop-color="#0a0c13" />
    </linearGradient>
    <linearGradient id="apertureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9500" />
      <stop offset="100%" stop-color="#ff3b30" />
    </linearGradient>
    <linearGradient id="shutterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007aff" />
      <stop offset="100%" stop-color="#5856d6" />
    </linearGradient>
    <linearGradient id="isoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34c759" />
      <stop offset="100%" stop-color="#30b0c7" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="520" rx="16" fill="url(#triBg)" stroke="#222a3d" stroke-width="2" />

  <!-- Diagram Title -->
  <text x="400" y="45" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800" text-anchor="middle">
    THE PHOTOGRAPHIC EXPOSURE TRIANGLE
  </text>
  <text x="400" y="70" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">
    Three interdependent controls balancing image brightness, depth of field, motion blur, and digital noise.
  </text>

  <!-- Central Exposure Triangle Shape -->
  <polygon points="400,120 660,420 140,420" fill="none" stroke="#263147" stroke-width="3" stroke-dasharray="6 6" />
  
  <!-- Central EV Indicator -->
  <circle cx="400" cy="300" r="48" fill="#151b29" stroke="#ff8c33" stroke-width="2" />
  <text x="400" y="295" fill="#ff8c33" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" text-anchor="middle">EV 0</text>
  <text x="400" y="315" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">BALANCED</text>

  <!-- Vertex 1: APERTURE (Top) -->
  <g transform="translate(400, 115)">
    <circle cx="0" cy="0" r="28" fill="#1c2333" stroke="url(#apertureGrad)" stroke-width="3" />
    <!-- Aperture Icon -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ff9500" stroke-width="2" />
    <polygon points="-5,-8 8,-6 6,7 -7,5" fill="#ff9500" />
    
    <text x="0" y="-38" fill="#ff9500" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="middle">APERTURE (f-stop)</text>
    <text x="0" y="-22" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Controls Depth of Field &amp; Light Volume</text>
    
    <!-- Scale tags -->
    <rect x="-190" y="-12" width="130" height="24" rx="4" fill="#151a24" stroke="#252d3d" />
    <text x="-125" y="4" fill="#34c759" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">f/1.4 (Shallow / Blur)</text>
    
    <rect x="60" y="-12" width="130" height="24" rx="4" fill="#151a24" stroke="#252d3d" />
    <text x="125" y="4" fill="#ff3b30" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">f/16 (Deep / Sharp)</text>
  </g>

  <!-- Vertex 2: SHUTTER SPEED (Bottom Right) -->
  <g transform="translate(660, 420)">
    <circle cx="0" cy="0" r="28" fill="#1c2333" stroke="url(#shutterGrad)" stroke-width="3" />
    <!-- Stopwatch Icon -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#007aff" stroke-width="2" />
    <line x1="0" y1="0" x2="6" y2="-6" stroke="#007aff" stroke-width="2" />
    
    <text x="0" y="45" fill="#007aff" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="middle">SHUTTER SPEED</text>
    <text x="0" y="62" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Controls Motion Blur vs Freezing</text>
    
    <rect x="-65" y="72" width="130" height="22" rx="4" fill="#151a24" stroke="#252d3d" />
    <text x="0" y="87" fill="#007aff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">1/4000s &rarr; 1 full sec</text>
  </g>

  <!-- Vertex 3: ISO SENSITIVITY (Bottom Left) -->
  <g transform="translate(140, 420)">
    <circle cx="0" cy="0" r="28" fill="#1c2333" stroke="url(#isoGrad)" stroke-width="3" />
    <!-- Sensor Grid Icon -->
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="none" stroke="#34c759" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#34c759" />
    
    <text x="0" y="45" fill="#34c759" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="middle">ISO SENSITIVITY</text>
    <text x="0" y="62" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Controls Sensor Gain &amp; Noise</text>
    
    <rect x="-65" y="72" width="130" height="22" rx="4" fill="#151a24" stroke="#252d3d" />
    <text x="0" y="87" fill="#34c759" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">ISO 100 &rarr; ISO 12,800</text>
  </g>
</svg>
