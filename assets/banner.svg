<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12" />
      <stop offset="50%" stop-color="#121622" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c33" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aaff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="lensReflect" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#1f2c44" />
      <stop offset="50%" stop-color="#101524" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" stroke="#1e2538" stroke-width="3" />

  <!-- Grid overlay -->
  <g stroke="#1a2233" stroke-width="1" opacity="0.6">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Camera Lens Graphic (Right Side) -->
  <g transform="translate(920, 210)">
    <!-- Outer Glow -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(255, 107, 0, 0.15)" stroke-width="12" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#252e42" stroke-width="4" stroke-dasharray="6 6" />
    <!-- Metallic Barrel -->
    <circle cx="0" cy="0" r="125" fill="#151a26" stroke="#333e59" stroke-width="8" />
    <circle cx="0" cy="0" r="110" fill="#0c0f17" stroke="url(#orangeGlow)" stroke-width="3" filter="url(#glow)" />
    <!-- Glass Elements -->
    <circle cx="0" cy="0" r="90" fill="url(#lensReflect)" stroke="#222b3d" stroke-width="4" />
    <circle cx="0" cy="0" r="60" fill="#080a10" stroke="url(#blueGlow)" stroke-width="2" opacity="0.8" />
    <!-- Aperture Blades -->
    <circle cx="0" cy="0" r="30" fill="#030408" />
    <polygon points="-12,-20 18,-24 25,6 -6,22 -22,-2" fill="url(#orangeGlow)" opacity="0.75" />
    <!-- Glass Flare -->
    <ellipse cx="-25" cy="-25" rx="35" ry="18" transform="rotate(-35 -25 -25)" fill="#ffffff" opacity="0.2" />
    <!-- Calibration ticks -->
    <text x="0" y="-128" fill="#ff8c33" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">50mm F/1.2</text>
    <text x="0" y="136" fill="#6b7a99" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ASPH | FULL-FRAME</text>
  </g>

  <!-- Title & Typography (Left Side) -->
  <g transform="translate(80, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="28" rx="6" fill="rgba(255, 107, 0, 0.15)" stroke="rgba(255, 107, 0, 0.4)" stroke-width="1" />
    <text x="110" y="18" fill="#ff8c33" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="1.5" text-anchor="middle">📷 INTERACTIVE CAMERA LAB</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      LearnCamera <tspan fill="#ff8c33">&amp;</tspan> CamClone
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" fill="#9aa2b1" font-family="'Inter', sans-serif" font-size="17" font-weight="400">
      Master Exposure Physics, Camera Models, Depth of Field &amp; Creative Multi-Exposure Cloning.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 165)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="36" rx="18" fill="#19202f" stroke="#2c364d" stroke-width="1" />
      <circle cx="18" cy="18" r="5" fill="#34c759" />
      <text x="32" y="22" fill="#e1e6f0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Exposure Triangle</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="165" height="36" rx="18" fill="#19202f" stroke="#2c364d" stroke-width="1" />
      <circle cx="203" cy="18" r="5" fill="#007aff" />
      <text x="217" y="22" fill="#e1e6f0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Webcam Clone Lab</text>

      <!-- Pill 3 -->
      <rect x="365" y="0" width="165" height="36" rx="18" fill="#19202f" stroke="#2c364d" stroke-width="1" />
      <circle cx="383" cy="18" r="5" fill="#ff9500" />
      <text x="397" y="22" fill="#e1e6f0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Pinhole 3D Optics</text>

      <!-- Pill 4 -->
      <rect x="545" y="0" width="145" height="36" rx="18" fill="#19202f" stroke="#2c364d" stroke-width="1" />
      <circle cx="563" cy="18" r="5" fill="#af52de" />
      <text x="577" y="22" fill="#e1e6f0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">PWA Offline</text>
    </g>
  </g>
</svg>
